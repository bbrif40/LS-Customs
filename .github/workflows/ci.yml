name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

defaults:
  run:
    working-directory: LS-Customs

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LS-Customs/package-lock.json
      - run: npm ci
      - name: Type-check shared-types
        run: npm run typecheck --workspace=@ls-customs/shared-types
      - name: Type-check web
        run: npm run typecheck --workspace=@ls-customs/web
      - name: Check backend
        run: npm run typecheck --workspace=@ls-customs/backend

  migration-test:
    name: Migration Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations via Supabase CLI
        run: |
          supabase db start --workdir apps/backend

  function-typecheck:
    name: Edge Function Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          failed=0
          for f in apps/backend/supabase/functions/*/index.ts; do
            echo "Checking $f..."
            if ! out=$(deno check "$f" 2>&1); then
              echo "::error file=$f::$out"
              echo "$out"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
